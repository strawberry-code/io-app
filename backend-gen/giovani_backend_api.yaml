    type: object
    title: User Metadata information
    properties:
      version:
        type: number
      metadata:
        type: string
    required:
      - version
      - metadata
  PublicSession:
    type: object
    title: User session data
    description: Describe the current session of an authenticated user.
    properties:
      spidLevel:
        $ref: "#/definitions/SpidLevel"
