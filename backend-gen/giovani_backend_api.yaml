  MessageContentWithAttachments:
    allOf:
      - type: object
        properties:
          attachments:
            type: array
            items:
              $ref: "#/definitions/MessageAttachmentFile"
      - $ref: "#/definitions/MessageContent"
  CreatedMessageWithContentAndAttachments:
    allOf:
      - type: object
        properties:
          content:
            $ref: "#/definitions/MessageContentWithAttachments"
          status:
            type: string
            enum:
              - ACCEPTED
              - ADDED_TO_CAL
              - BOOKED_DOC
              - DOWNLOADED_DOC
              - DOWNLOADED_CRED
              - EXPIRED
              - PENDING
              - REJECTED
              - VIEWED_INFORMATIVE
        required:
          - content
      - $ref: "#/definitions/CreatedMessageWithoutContent"
  Installation:
    type: object
    title: Installation
    description: Describes an app installation.
    properties:
      platform:
        $ref: "#/definitions/Platform"
      pushChannel:
        $ref: "#/definitions/PushChannel"
      bundleId:
        $ref: "#/definitions/BundleId"
    required:
      - platform
      - pushChannel
  InitializedProfile:
    type: object
    title: Initialized profile
    description: Describes the user's profile after it has been stored in the Profile API.
    properties:
      registered_services:
        type: array
        items:
          type: string
      accepted_tos_version:
        $ref: "#/definitions/AcceptedTosVersion"
      accepted_privacy_version:
        $ref: "#/definitions/AcceptedTosVersion"
      email:
        $ref: "#/definitions/EmailAddress"
      blocked_inbox_or_channels:
        $ref: "#/definitions/BlockedInboxOrChannels"
