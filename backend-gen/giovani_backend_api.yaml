swagger: "2.0"
info:
  version: 1.0.0
  title: Proxy API
  description: Mobile and web proxy API gateway.
host: localhost
basePath: /api/v1
schemes:
  - https
security:
  - Bearer: []
paths:
  "/updateServiceSubscription":
    put:
      operationId: updateServiceSubscription
      summary: Update Service Subscription
      description: |-
        Return the updated profile for the serviceId
      parameters:
        - in: body
          name: body
          schema:
            $ref: "#/definitions/UpdateServiceSubscription"
          required: true
          x-examples:
            application/json:
              - service_id: "01CFAGRMGB9XCA8B2CQ4QA7K76"
                unsubscribe: true
      responses:
        "200":
          description: Updated.
          schema:
            $ref: "#/definitions/Profile"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No message found for the provided ID.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the message.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/services/{service_id}":
    x-swagger-router-controller: ServicesController
    parameters:
      - name: service_id
        in: path
        type: string
        required: true
        description: The ID of an existing Service.
    get:
      operationId: getService
      summary: Get Service
      description: A previously created service with the provided service ID is returned.
      responses:
        "200":
          description: Service found.
          schema:
            "$ref": "#/definitions/ServicePublic"
          examples:
            application/json:
              department_name: "IO"
              organization_fiscal_code: "00000000000"
              organization_name: "IO"
              service_id: "5a563817fcc896087002ea46c49a"
              service_name: "App IO"
              version: 1
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No service found for the provided ID.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the service.
          schema:
            $ref: "#/definitions/ProblemJson"
      parameters: []
  "/services":
    x-swagger-router-controller: ServicesController
    get:
      operationId: getVisibleServices
      summary: Get all visible services
      description: |-
        Returns the description of all visible services.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/PaginatedServiceTupleCollection"
          examples:
            application/json:
              items:
                - service_id: "AzureDeployc49a"
                  version: 1
                - service_id: "5a25abf4fcc89605c082f042c49a"
                  version: 0
              page_size: 1
        "401":
          description: Bearer token null or expired.
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the services.
          schema:
            $ref: "#/definitions/ProblemJson"
      parameters:
        - $ref: "#/parameters/PaginationRequest"
  "/messages":
    x-swagger-router-controller: MessagesController
    parameters:
      - $ref: "#/parameters/PaginationRequest"
    get:
      operationId: getUserMessages
      summary: Get user's messages
      description: |-
        Returns the messages for the user identified by the provided fiscal code.
        Messages will be returned in inverse acceptance order (from last to first).
        The "next" field, when present, contains an URL pointing to the next page of results.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/PaginatedCreatedMessageWithoutContentCollection"
          examples:
            application/json:
              items:
                - created_at: "2018-05-21T07:36:41.209Z"
                  fiscal_code: "LSSLCU79B24L219P"
                  id: "01CE0T1Z18T3NT9ECK5NJ09YR3"
                  sender_service_id: "5a563817fcc896087002ea46c49a"
                  time_to_live: 3600
                - created_at: "2018-05-21T07:41:01.361Z"
                  fiscal_code: "LSSLCU79B24L219P"
                  id: "01CE0T9X1HT595GEF8FH9NRSW7"
                  sender_service_id: "5a563817fcc896087002ea46c49a"
                  time_to_live: 3600
              page_size: 2
              next: https://example.com/next
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No message found.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the messages.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/messages/{id}":
    x-swagger-router-controller: MessagesController
    parameters:
      - name: id
        in: path
        type: string
        required: true
        description: The ID of the message.
    get:
      operationId: getUserMessage
      summary: Get message
      description: |-
        Returns the message with the provided message ID.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/CreatedMessageWithContentAndAttachments"
          examples:
            application/json: |
              content: {
                markdown: "hey hey !! <a style=\"color: red\" href=\"http://example.com\"> some content here ..... this is a link with a style applied, some other content</a>",
                subject: "my subject ............",
                attachments: [{name:"attachment", content:"aBase64Encoding", mime_type: "image/png"}]
              },
              created_at: "2018-06-06T12:22:24.523Z",
              fiscal_code: "LSSLCU79B24L219P",
              id: "01CFAGRMGB9XCA8B2CQ4QA7K76",
              sender_service_id: "5a25abf4fcc89605c082f042c49a",
              time_to_live: 3600
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No message found for the provided ID.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the message.
          schema:
            $ref: "#/definitions/ProblemJson"
    put:
      operationId: putUserMessage
      summary: Put message
      description: |-
        Returns the message with the provided message ID.
      parameters:
        - in: body
          name: body
          schema:
            $ref: "#/definitions/CreatedMessageWithContent"
          required: true
          x-examples:
            application/json:
              - created_at: "2018-05-21T07:36:41.209Z"
                fiscal_code: "LSSLCU79B24L219P"
                id: "01CE0T1Z18T3NT9ECK5NJ09YR3"
                sender_service_id: "5a563817fcc896087002ea46c49a"
                time_to_live: 3600
      responses:
        "200":
          description: Updated.
          schema:
            $ref: "#/definitions/CreatedMessageWithContent"
          examples:
            application/json: |
              content: {
                markdown: "hey hey !! <a style=\"color: red\" href=\"http://example.com\"> some content here ..... this is a link with a style applied, some other content</a>",
                subject: "my subject ............",
                attachments: [{name:"attachment", content:"aBase64Encoding", mime_type: "image/png"}]
              },
              created_at: "2018-06-06T12:22:24.523Z",
              fiscal_code: "LSSLCU79B24L219P",
              id: "01CFAGRMGB9XCA8B2CQ4QA7K76",
              sender_service_id: "5a25abf4fcc89605c082f042c49a",
              time_to_live: 3600
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No message found for the provided ID.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the message.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/messages/{id}/archive":
    x-swagger-router-controller: MessagesController
    parameters:
      - name: id
        in: path
        type: string
        required: true
        description: The ID of the message.
    put:
      operationId: archiveUserMessage
      summary: Archive message
      description: |-
        Archive the message and saves the data on DB.
      parameters:
        - in: body
          name: body
          schema:
            $ref: "#/definitions/ArchiveMessageRequestObject"
          required: true
      responses:
        "200":
          description: Updated.
          schema:
            $ref: "#/definitions/CreatedMessageWithContent"
          examples:
            application/json: |
              content: {
                markdown: "hey hey !! <a style=\"color: red\" href=\"http://example.com\"> some content here ..... this is a link with a style applied, some other content</a>",
                subject: "my subject ............",
                attachments: [{name:"attachment", content:"aBase64Encoding", mime_type: "image/png"}]
              },
              created_at: "2018-06-06T12:22:24.523Z",
              fiscal_code: "LSSLCU79B24L219P",
              id: "01CFAGRMGB9XCA8B2CQ4QA7K76",
              sender_service_id: "5a25abf4fcc89605c082f042c49a",
              time_to_live: 3600
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ArchiveProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No message found for the provided ID.
          schema:
            $ref: "#/definitions/ArchiveProblemJson"
        "422":
          description: Orchestratore error
          schema:
            $ref: "#/definitions/ArchiveProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ArchiveProblemJson"
        "500":
          description: There was an error in retrieving the message.
          schema:
            $ref: "#/definitions/ArchiveProblemJson"
  "/documents/dossier":
    x-swagger-router-controller: DocumentsController
    get:
      operationId: getUserDossierDocuments
      summary: Get user's documents
      description: |-
        Returns the documents for the user identified by the provided fiscal code.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/DocumentsCollection"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No message found.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the document.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/documents/dossier/{id}":
    x-swagger-router-controller: DocumentsController
    parameters:
      - name: id
        in: path
        type: string
        required: true
        description: The ID of the document.
    put:
      operationId: putUserDossierDocument
      summary: Put document
      description: |-
        Updates the document with the provided document ID.
      parameters:
        - in: body
          name: body
          schema:
            $ref: "#/definitions/DossierDocumentPutObject"
          required: true
      responses:
        "200":
          description: Updated.
          schema:
            $ref: "#/definitions/DossierDocument"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No document found for the provided ID.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the document.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/documents/occupation":
    x-swagger-router-controller: DocumentsController
    get:
      operationId: getUserOccupationDocuments
      summary: Get user's occupation documents
      description: |-
        Returns the occupation documents for the user identified by the provided fiscal code.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/OccupationDocumentsCollection"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No message found.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the document.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/documents/occupation/{id}":
    x-swagger-router-controller: DocumentsController
    parameters:
      - name: id
        in: path
        type: string
        required: true
        description: The ID of the document.
    get:
      operationId: getUserOccupationDocument
      summary: Get user's occupation document details
      description: |-
        Returns the occupation document details for the user identified by the provided fiscal code.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/OccupationDocumentDetails"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: Document not found.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the document.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/documents/occupational-status":
    x-swagger-router-controller: DocumentsController
    post:
      operationId: postOccupationalStatus
      summary: Request the occupational status
      parameters:
        - in: body
          name: body
          schema:
            $ref: "#/definitions/OccupationalStatusRequestObject"
          required: true
      responses:
        "201":
          description: Occupational status requested.
          schema:
            $ref: "#/definitions/OccupationalStatusRequestObject"
        "400":
          description: Invalid payload.
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: User not found
          schema:
            $ref: "#/definitions/ProblemJson"
        "409":
          description: Conflict.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: Occupational status can not be required.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/retrieve_doc/{id}":
    x-swagger-router-controller: DocumentsController
    parameters:
      - name: id
        in: path
        type: string
        required: true
        description: The ID of the attachment.
    get:
      operationId: getUserDocumentFile
      summary: Get attachment
      description: |-
        Returns the attachment with the provided attachment ID.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/MessageAttachmentFile"
          examples:
            application/json: |
              {id: "01CFAGRMGB9XCA8B2CQ4QA7K76", name:"attachment", content:"aBase64Encoding", mime_type: "image/png"}
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: No attachment found for the provided ID.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the attachment.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/book_doc/{id}":
    x-swagger-router-controller: DocumentsController
    parameters:
      - name: id
        in: path
        type: string
        required: true
        description: The ID of an existing DossierDocument.
    post:
      operationId: postBookDocument
      summary: Book a User's document
      description: Book the document by the document id.
      responses:
        "200":
          description: Document booked.
          schema:
            $ref: "#/definitions/InstanceId"
        "400":
          description: Invalid payload.
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: User not found
          schema:
            $ref: "#/definitions/ProblemJson"
        "409":
          description: Conflict.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: Document cannot be booked.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/profile":
    x-swagger-router-controller: ProfileController
    get:
      operationId: getUserProfile
      summary: Get user's profile
      description: Returns the profile for the user identified by the provided fiscal code.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/InitializedProfile"
          examples:
            application/json:
              email: "email@example.com"
              family_name: "Rossi"
              fiscal_code: "TMMEXQ60A10Y526X"
              has_profile: true
              is_email_set: true
              is_inbox_enabled: true
              is_webhook_enabled: true
              name: "Mario"
              spid_email: "preferred@example.com"
              spid_mobile_phone: "1234567890"
              version: 1
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the user profile.
          schema:
            $ref: "#/definitions/ProblemJson"
    post:
      operationId: updateProfile
      summary: Update the User's profile
      description: Update the profile for the user identified by the provided fiscal code.
      parameters:
        - in: body
          name: body
          schema:
            $ref: "#/definitions/Profile"
          required: true
          x-examples:
            application/json:
              email: foobar@example.com
              preferred_languages: [it_IT]
              is_inbox_enabled: true
              is_webhook_enabled: false
              version: 1
      responses:
        "200":
          description: Profile updated.
          schema:
            $ref: "#/definitions/InitializedProfile"
          examples:
            application/json:
              email: "email@example.com"
              family_name: "Rossi"
              fiscal_code: "TMMEXQ60A10Y526X"
              has_profile: true
              is_email_set: true
              is_inbox_enabled: true
              is_webhook_enabled: true
              name: "Mario"
              spid_email: "preferred@example.com"
              spid_mobile_phone: "1234567890"
              version: 1
        "400":
          description: Invalid payload.
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: User not found
          schema:
            $ref: "#/definitions/ProblemJson"
        "409":
          description: Conflict.
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: Profile cannot be updated.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/api-profile":
    x-swagger-router-controller: ProfileController
    get:
      operationId: getApiUserProfile
      summary: Get user's profile stored into the API
      description: Returns the profile for the user identified by the provided fiscal code.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/ExtendedProfile"
          examples:
            application/json:
              email: "email@example.com"
              preferred_languages: ["it_IT"]
              is_inbox_enabled: true
              accepted_tos_version: 1
              accepted_privacy_version: 2
              is_webhook_enabled: true
              is_email_enabled: true
              version: 1
              sender_allowed: true
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: Profile not found
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error in retrieving the user profile.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/email-validation-process":
    x-swagger-router-controller: ProfileController
    post:
      operationId: startEmailValidationProcess
      summary: Start the Email Validation Process
      description: |-
        Start the email validation process that create the validation token
        and send the validation email
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "404":
          description: Profile not found
          schema:
            $ref: "#/definitions/ProblemJson"
        "429":
          description: Too many requests
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: There was an error starting email validation process
          schema:
            $ref: "#/definitions/ProblemJson"
  "/user-identity":
    x-swagger-router-controller: ProfileController
    get:
      operationId: getUserIdentity
      summary: Get stored user identity
      description: Returns the user identity stored during the login phase
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/UserIdentity"
          examples:
            application/json:
              family_name: "Rossi"
              fiscal_code: "TMMEXQ60A10Y526X"
              name: "Mario"
              spid_email: "preferred@example.com"
              spid_mobile_phone: "1234567890"
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "500":
          description: There was an error in retrieving the user profile.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/user-metadata":
    x-swagger-router-controller: userMetadataController
    get:
      operationId: getUserMetadata
      summary: Get user's metadata
      description: Returns metadata for the current authenticated user.
      responses:
        "200":
          description: Found.
          schema:
            $ref: "#/definitions/UserMetadata"
        "204":
          description: No Content.
        "401":
          description: Bearer token null or expired.
        "500":
          description: There was an error in retrieving the user metadata.
          schema:
            $ref: "#/definitions/ProblemJson"
    post:
      operationId: upsertUserMetadata
      summary: Set User's metadata
      description: Create or update metadata for the current authenticated user.
      parameters:
        - in: body
          name: body
          schema:
            $ref: "#/definitions/UserMetadata"
          required: true
      responses:
        "200":
          description: User Metadata updated.
          schema:
            $ref: "#/definitions/UserMetadata"
        "400":
          description: Invalid payload.
          schema:
            $ref: "#/definitions/ProblemJson"
        "401":
          description: Bearer token null or expired.
        "409":
          description: Conflict.
          schema:
            $ref: "#/definitions/ProblemJson"
        "500":
          description: Profile cannot be updated.
          schema:
            $ref: "#/definitions/ProblemJson"
  "/installations/{installationID}":
    x-swagger-router-controller: NotificationController
    parameters:
      - name: installationID
        in: path
        required: true
        description: The ID of the message.
        type: string
    put:
      operationId: createOrUpdateInstallation
      summary: Create or update an Installation
      description: Create or update an Installation to the Azure Notification hub.
      parameters:
        - name: body
          in: body
          schema:
            $ref: "#/definitions/Installation"
          required: true
          x-examples:
            application/json:
              platform: "gcm"
              pushChannel: "fLKP3EATnBI:APA91bEy4go681jeSEpLkNqhtIrdPnEKu6Dfi-STtUiEnQn8RwMfBiPGYaqdWrmzJyXIh5Yms4017MYRS9O1LGPZwA4sOLCNIoKl4Fwg7cSeOkliAAtlQ0rVg71Kr5QmQiLlDJyxcq3p"
