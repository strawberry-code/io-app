        $ref: "#/definitions/PreferredLanguages"
      is_inbox_enabled:
        $ref: "#/definitions/IsInboxEnabled"
      is_email_validated:
        $ref: "#/definitions/IsEmailValidated"
      is_email_enabled:
        $ref: "#/definitions/IsEmailEnabled"
      is_webhook_enabled:
        $ref: "#/definitions/IsWebhookEnabled"
      family_name:
        type: string
      fiscal_code:
        $ref: "#/definitions/FiscalCode"
      has_profile:
        $ref: "#/definitions/HasProfile"
      name:
        type: string
      spid_email:
        $ref: "#/definitions/EmailAddress"
      spid_mobile_phone:
        type: string
        minLength: 1
      date_of_birth:
        type: string
        format: date
      version:
        $ref: "#/definitions/Version"
    required:
      - family_name
      - fiscal_code
      - has_profile
      - is_inbox_enabled
      - is_email_enabled
      - is_webhook_enabled
      - name
      - version
